enabled: true
built_in_css: true
inline_css: true
refresh_nonce: false
refresh_prevention: false
client_side_validation: true
debug: false
inline_errors: false
modular_form_fix: true
files:
  multiple: false          # To allow multiple files, default is single
  limit: 10                # Number of allowed files per field (multiple required)
  destination: 'self@'     # Where to upload the files (path and self@, page@, theme@)
  avoid_overwriting: false # Prevent files with the same name to be overridden. Date prefix will be added
  random_name: false       # Generate a random 15 long string name for the uploaded files
  filesize: 0              # Maximum file size allowed (in MB)
  accept:                  # List of mime/types or file extensions allowed (ie, image/*,.zip,.mp4)
    - image/*
recaptcha:
    version: 2-checkbox
    score_threshold: 0.5
    theme: light
    site_key:
    secret_key:
cap:
  mode: invisible             # options: invisible | checkbox
  storage: files              # options: files | grav-cache | filesystem
  challenge_count: 50         # number of sub-challenges per captcha
  challenge_size: 32          # salt size (hex chars)
  challenge_difficulty: 4     # target prefix length (hex chars)
  expires_ms: 600000          # challenge TTL in milliseconds
  adaptive: true              # repeat submissions from one IP make its challenges harder
  adaptive_free: 10           # submissions per IP per window at the normal cost
  adaptive_window: 600        # window length in seconds
  adaptive_max_level: 8       # each level past the free allowance doubles the work; 8 = 256x
  min_time: 3                 # seconds a form must be on the page before it can be sent; 0 turns it off
  instrumentation: true       # a browser check runs with every challenge (needs PHP 8.1 and cap-php 1.1)
  block_automated_browsers: true  # refuse headless and automated browsers the check detects
  behavior: off               # off | report | block: score mouse and keyboard behavior (experimental)
  block_agents: off           # off | identified | all: refuse AI agents (needs behavior on)

turnstile:
  theme: light                # options: [light | dark]
  site_key:
  secret_key:

basic_captcha:
  type: characters         # Options: characters, math, dotcount, position
  debug: false             # Enable debug logging for troubleshooting

  # Image settings
  image:
    width: 135             # Image width (default: 135 for classic size)
    height: 40             # Image height (default: 40 for classic size)
    bg: '#ffffff'          # Background color

  # Character captcha settings (used for the 'characters' type)
  chars:
    length: 6              # Number of characters to display
    font: zxx-xed.ttf      # Font file in the plugin's fonts directory
    size: 24               # Font size
    box_width: 200         # Image width
    box_height: 70         # Image height
    start_x: 10            # Starting X position for text
    start_y: 40            # Starting Y position for text
    bg: '#ffffff'          # Background color
    text: '#000000'        # Text color

  # Math puzzle settings (used for the 'math' type)
  math:
    min: 1                 # Minimum number value
    max: 12                # Maximum number value
    operators: ['+','-','*']  # Available operators

  # Dot counting settings (used for the 'dotcount' type)
  dots:
    rows: 2                # Grid rows available for dots
    cols: 4                # Grid columns available for dots
    min: 2                 # Fewest dots to count
    max: 5                 # Most dots to count (capped at rows * cols - 1)
